name: "Add a Template"
description: "Submit a Google Docs template for consideration."
title: "[submission]"
labels:
  - "submission"
body:
- type: input
  id: name
  attributes:
    label: "Template Name:"
  validations:
    required: true
- type: input
  id: author
  attributes:
    label: "Author:"
  validations:
    required: true
- type: dropdown
  id: category
  attributes:
    label: "Category:"
    options:
      - "Resume"
      - "Portfolio"
      - "Newsletter"
      - "eBook"
      - "Recipe"
      - "Experimental"
      - "Other"
  validations:
    required: true
